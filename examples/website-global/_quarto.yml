project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - doctrine.qmd
    - constitution.qmd

website:
  title: "reusable-footnotes — website global numbering"
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: doctrine.qmd
        text: Doctrine
      - href: constitution.qmd
        text: Constitution

bibliography: ../../references.bib
suppress-bibliography: true

filters:
  - ../../_extensions/bibentry/bibentry.lua
  - ../../_extensions/reusable-footnotes/reusable-footnotes.lua

reusable-footnotes:
  enabled: true
  backlinks: true
  scope: page
  numbering: continuous
  html-order:
    - index.qmd
    - doctrine.qmd
    - constitution.qmd

format:
  html:
    toc: true
