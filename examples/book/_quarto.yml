project:
  type: book
  output-dir: _book

book:
  title: "reusable-footnotes — book example"
  chapters:
    - index.qmd
    - doctrine.qmd
    - constitution.qmd

bibliography: ../../references.bib
suppress-bibliography: true

filters:
  - ../../_extensions/bibentry/bibentry.lua
  - ../../_extensions/reusable-footnotes/reusable-footnotes.lua

reusable-footnotes:
  enabled: true
  backlinks: true
  scope: page
  numbering: page

format:
  html:
    toc: true
